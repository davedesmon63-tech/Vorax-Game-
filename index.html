<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORAX 3 DIVISIONS - MEILLEURE DIVISION</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap');
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Arial;padding:8px}
h1{font-family:'Cinzel',serif;color:#FFD700;text-align:center}
.card{background:linear-gradient(145deg,#111,#1a1600);border:1.5px solid #D4AF37;border-radius:14px;padding:12px;margin:12px 0}
.btn{background:linear-gradient(145deg,#FFD700,#D4AF37);color:#000;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;cursor:pointer;margin:4px 0}
.grid3{display:grid;grid-template-columns:1fr;gap:10px} @media(min-width:700px){.grid3{grid-template-columns:1fr 1fr 1fr}}
img.div-img{width:100%;height:180px;object-fit:cover;border-radius:10px;border:2px solid #FFD700;background:#000;display:block}
.vote-bar{height:10px;background:#222;border-radius:6px;overflow:hidden;border:1px solid #D4AF37;margin-top:6px}
.vote-fill{height:100%;background:linear-gradient(90deg,#FFD700,#D4AF37);transition:.5s}
input{width:100%;padding:11px;border-radius:8px;border:1px solid #D4AF37;background:#111;color:#FFD700;margin:6px 0}
.stat{border:1px solid #D4AF37;background:#111;padding:8px;border-radius:8px;text-align:center}
.best-div{border:2px solid #FFD700;background:linear-gradient(145deg,#2a2200,#1a1600);box-shadow:0 0 20px rgba(255,215,0,.5)}
</style>
</head>
<body>
<h1>👑 VORAX GAME<br><span style="font-size:14px;letter-spacing:5px">3 DIVISIONS GOLD</span></h1>
<div id="status" style="text-align:center;color:#FFD700;border:1px solid #D4AF37;padding:8px;border-radius:8px;margin:10px">⏳ Chargement...</div>

<div class="card" style="border:2px solid #FFD700">
<h3 style="text-align:center">🏆 DIVISIONS (3)</h3>
<div class="grid3" id="trophyDivs"></div>
</div>

<div class="card">
<h3 style="text-align:center">⚔️ VOTE FOR THE DIVISION</h3>
<div id="voteDivs"></div>
<div class="stat" style="margin-top:10px"><b style="color:#FFD700">Total clics: <span id="totalClicks">0</span></b></div>
</div>

<div class="card" style="border:2px solid #FFD700">
<h3 style="text-align:center">👑 PALMARES & RESULTATS</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div class="stat best-div" style="grid-column: span 2"><div style="font-size:28px">🏆</div><b style="color:#FFD700;font-size:16px">MEILLEURE DIVISION</b><br><span id="meilleureDiv" style="color:#FFD700;font-weight:900;font-size:18px">En cours...</span><br><small id="meilleureStats"></small></div>
<div class="stat"><div style="font-size:24px">🧠</div><b>BEST STRATEGE</b><br><span id="bestStrat" style="color:#FFD700">-</span></div>
<div class="stat"><div style="font-size:24px">🌟</div><b>PRODIGE</b><br><span id="prodige" style="color:#FFD700">-</span></div>
<div class="stat" style="grid-column: span 2"><div style="font-size:24px">🔥</div><b>RECORD</b><br><span id="record" style="color:#FFD700">-</span></div>
</div>
</div>

<div class="card" style="border:2px solid #FFD700;background:linear-gradient(145deg,#1a1600,#332b00)">
<h3 style="text-align:center">⚖️ PANEL ADMIN</h3>
<div id="loginZone"><input type="password" id="codeJuge" placeholder="Code VORAX2024"><button class="btn" onclick="devenirJuge()">🔓 ADMIN LOGIN</button></div>
<div id="adminZone" style="display:none">
<p style="color:#0f0;text-align:center">✅ Mode Admin</p>
<div id="statsClicks" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div>
<button class="btn" style="background:#ff4444;color:#fff;padding:6px" onclick="resetClicks()">Reset</button>
<hr style="border-color:#D4AF37"><div id="editDivs"></div><hr>
<input id="inBest" placeholder="Best Stratege"><input id="inProd" placeholder="Prodige"><input id="inRec" placeholder="Record"><button class="btn" onclick="savePalmares()">Sauver Palmares</button><hr>
<div id="adminList"></div><div style="display:flex;gap:6px"><input id="newAdmin" placeholder="Nouvel admin"><button class="btn" style="width:90px" onclick="addAdmin()">+</button></div>
<button class="btn" id="btnSave" onclick="sauvegarderCloud()" style="margin-top:12px;background:linear-gradient(145deg,#00ff88,#00cc66)">☁️ SAUVER POUR TOUS</button><div id="uploadStatus" style="text-align:center;color:#FFD700;margin-top:8px;font-weight:bold"></div>
</div>
</div>

<script>
const NPOINT_ID="de329fea08ff9cce6bea";const NPOINT_URL="https://api.npoint.io/"+NPOINT_ID;
let DATA={D1:{nom:"DIVISION 1",img:"",votes:0,clicks:0},D2:{nom:"DIVISION 2",img:"",votes:0,clicks:0},D3:{nom:"DIVISION 3",img:"",votes:0,clicks:0},PALMARES:{BEST_STRAT:"",PRODIGE:"",RECORD:""},ADMINS:["Admin Principal"],TOTAL_CLICKS:0};
let isAdmin=localStorage.getItem('vorax_admin')==='true';let pendingImages={};const CODE="VORAX2024";
function devenirJuge(){if(document.getElementById('codeJuge').value===CODE){isAdmin=true;localStorage.setItem('vorax_admin','true');document.getElementById('adminZone').style.display='block';document.getElementById('loginZone').style.display='none';renderAdmin();}else alert('Code faux');}
if(isAdmin){document.getElementById('adminZone').style.display='block';document.getElementById('loginZone').style.display='none';}
async function chargerCloud(){try{const r=await fetch(NPOINT_URL);if(r.ok){let d=await r.json();if(d.D1){DATA.D1=d.D1||DATA.D1;DATA.D2=d.D2||DATA.D2;DATA.D3=d.D3||DATA.D3;if(d.PALMARES)DATA.PALMARES={...DATA.PALMARES,...d.PALMARES};if(d.ADMINS)DATA.ADMINS=d.ADMINS;if(d.TOTAL_CLICKS)DATA.TOTAL_CLICKS=d.TOTAL_CLICKS;}}document.getElementById('status').innerText="✅ 3 DIVISIONS - MEILLEURE DIVISION ACTIVE";}catch(e){}renderAll();if(isAdmin)renderAdmin();}
function renderAll(){renderDivs();renderVotes();renderPalm();}
function getMeilleure(){let max=0,best=null;['D1','D2','D3'].forEach(k=>{if((DATA[k].votes||0)>max){max=DATA[k].votes||0;best=DATA[k];}});return {best,max};}
function renderDivs(){let c=document.getElementById('trophyDivs');c.innerHTML='';['D1','D2','D3'].forEach(k=>{let d=DATA[k];c.innerHTML+=`<div style="text-align:center"><div style="border:2px solid #FFD700;border-radius:10px;overflow:hidden;background:#000">${d.img?`<img src="${d.img}" class="div-img">`:`<div style="height:180px;display:flex;align-items:center;justify-content:center;color:#D4AF37;background:#111">Image ${k}</div>`}</div><b style="color:#FFD700;display:block;margin-top:6px">${d.nom}</b><small>${d.clicks||0} clics</small></div>`;});}
function renderVotes(){let c=document.getElementById('voteDivs');c.innerHTML='';let total=['D1','D2','D3'].reduce((a,k)=>a+(DATA[k]?.votes||0),0)||1;['D1','D2','D3'].forEach(k=>{let d=DATA[k];let pct=Math.round((d.votes||0)/total*100);c.innerHTML+=`<div class="card" style="display:flex;align-items:center;gap:10px;margin:6px 0"><div style="width:70px;height:70px;border:2px solid #FFD700;border-radius:10px;overflow:hidden;flex-shrink:0">${d.img?`<img src="${d.img}" style="width:100%;height:100%;object-fit:cover">`:`<div style="height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-size:10px;color:#D4AF37">No img</div>`}</div><div style="flex:1"><b style="color:#FFD700">${d.nom}</b><div class="vote-bar"><div class="vote-fill" style="width:${pct}%"></div></div><small style="color:#FFD700">${d.votes||0} votes | ${d.clicks||0} clics - ${pct}%</small></div><button class="btn" style="width:80px" onclick="voter('${k}')">VOTE</button></div>`;});document.getElementById('totalClicks').innerText=DATA.TOTAL_CLICKS||0;let sc=document.getElementById('statsClicks');if(sc){sc.innerHTML='';['D1','D2','D3'].forEach(k=>{sc.innerHTML+=`<div class="stat"><b>${DATA[k].nom}</b><br>V:${DATA[k].votes||0}<br>C:${DATA[k].clicks||0}</div>`;});}}
function renderPalm(){
let {best,max}=getMeilleure();
if(best){document.getElementById('meilleureDiv').innerText=best.nom;document.getElementById('meilleureStats').innerText=max+" votes - "+Math.round(max/(['D1','D2','D3'].reduce((a,k)=>a+(DATA[k].votes||0),0)||1)*100)+"%";}
else{document.getElementById('meilleureDiv').innerText="Aucun vote";document.getElementById('meilleureStats').innerText="";}
document.getElementById('bestStrat').innerText=DATA.PALMARES.BEST_STRAT||"Non defini";document.getElementById('prodige').innerText=DATA.PALMARES.PRODIGE||"Non defini";document.getElementById('record').innerText=DATA.PALMARES.RECORD||"Non defini";
}
function renderAdmin(){renderDivs();let c=document.getElementById('editDivs');c.innerHTML='';['D1','D2','D3'].forEach(k=>{let d=DATA[k];c.innerHTML+=`<div style="margin:8px 0;padding:8px;background:#111;border-radius:8px"><label style="color:#FFD700">${k} Nom</label><input id="nom-${k}" value="${d.nom}"><input type="file" accept="image/*" onchange="compressAndStore(this,'${k}')"><div id="prev-${k}">${d.img?`<img src="${d.img}" style="height:50px;border:1px solid #FFD700">`:''}</div></div>`;});let al=document.getElementById('adminList');al.innerHTML='';(DATA.ADMINS||[]).forEach((a,i)=>{al.innerHTML+=`<div style="display:flex;justify-content:space-between;background:#111;padding:6px;border-radius:6px;margin:4px 0"><span>${a}</span><button style="background:#ff4444;color:#fff;border:none;padding:4px 8px;border-radius:4px" onclick="removeAdmin(${i})">X</button></div>`;});document.getElementById('inBest').value=DATA.PALMARES.BEST_STRAT||"";document.getElementById('inProd').value=DATA.PALMARES.PRODIGE||"";document.getElementById('inRec').value=DATA.PALMARES.RECORD||"";renderVotes();}
function compressAndStore(inp,k){let f=inp.files[0];if(!f)return;document.getElementById('prev-'+k).innerHTML="...";let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas');let w=im.width,h=im.height,M=600;if(w>M||h>M){if(w>h){h=h*M/w;w=M}else{w=w*M/h;h=M}}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);let b64=cv.toDataURL('image/jpeg',0.6);pendingImages[k]=b64;document.getElementById('prev-'+k).innerHTML=`<img src="${b64}" style="height:60px;border:2px solid #FFD700">`;};im.src=e.target.result;};r.readAsDataURL(f);}
async function sauvegarderCloud(){let b=document.getElementById('btnSave');b.disabled=true;b.innerText="Sauvegarde...";['D1','D2','D3'].forEach(k=>{let el=document.getElementById('nom-'+k);if(el)DATA[k].nom=el.value;});for(let k of Object.keys(pendingImages)){DATA[k].img=pendingImages[k];}pendingImages={};delete DATA.BEST;try{let res=await fetch(NPOINT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});if(res.ok)document.getElementById('uploadStatus').innerText="SAUVE!";}catch(e){}b.disabled=false;b.innerText="☁️ SAUVER POUR TOUS";renderAll();}
async function voter(k){DATA[k].votes=(DATA[k].votes||0)+1;DATA[k].clicks=(DATA[k].clicks||0)+1;DATA.TOTAL_CLICKS=(DATA.TOTAL_CLICKS||0)+1;renderAll();try{await fetch(NPOINT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});}catch(e){}}
function savePalmares(){DATA.PALMARES.BEST_STRAT=document.getElementById('inBest').value;DATA.PALMARES.PRODIGE=document.getElementById('inProd').value;DATA.PALMARES.RECORD=document.getElementById('inRec').value;renderPalm();sauvegarderCloud();}
function addAdmin(){let v=document.getElementById('newAdmin').value.trim();if(!v)return;DATA.ADMINS.push(v);document.getElementById('newAdmin').value='';renderAdmin();sauvegarderCloud();}
function removeAdmin(i){DATA.ADMINS.splice(i,1);renderAdmin();sauvegarderCloud();}
function resetClicks(){if(confirm('Reset?')){['D1','D2','D3'].forEach(k=>{DATA[k].votes=0;DATA[k].clicks=0;});DATA.TOTAL_CLICKS=0;renderAll();sauvegarderCloud();}}
chargerCloud();
</script>
</body>
  </html>
